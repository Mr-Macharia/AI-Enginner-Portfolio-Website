    <style>
      #boot { position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center; justify-items: center; gap: 1rem;
        background: #fff; color: #0f172a; font: 500 .8rem/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase;
        transition: opacity .45s ease, visibility 0s .45s; animation: boot-giveup .3s 10s forwards; }
      .boot-dark #boot { background: #0a0f1e; color: #f1f5f9; }
      #boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-track { position: relative; width: 140px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(148, 163, 184, .3); }
      .boot-track i { position: absolute; inset: 0; background: #e85d04; transform: translateX(-100%); animation: boot-slide 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
      @keyframes boot-slide { to { transform: translateX(100%); } }
      @keyframes boot-giveup { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .boot-track i { animation: none; transform: none; } }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('boot-dark'); } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Plain HTML so it shows on first paint; transform and opacity keep it moving while JS is busy. -->
    <div id="boot" aria-hidden="true">
      <span class="boot-name">Gichogu Macharia</span>
      <span class="boot-track"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
